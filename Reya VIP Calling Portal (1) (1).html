<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reya AI - VIP Voice Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif;
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(121, 40, 202, 0.15) 0%, transparent 40%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(15, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 0, 127, 0.1);
        }
        .neon-text {
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }
        .glowing-input:focus-within {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            border-color: #ff007f;
        }
        .mood-card {
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mood-card.active {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(121, 40, 202, 0.2));
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            transform: translateY(-2px);
        }
        .call-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca, #ff007f);
            background-size: 200% auto;
            transition: 0.5s;
        }
        .call-btn:hover {
            background-position: right center;
            box-shadow: 0 0 20px #ff007f, 0 0 40px #7928ca;
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ff007f; border-radius: 10px; }
        
        /* Loading Animation */
        .ring-container { position: relative; }
        .circle {
            width: 80px; height: 80px;
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #ff007f;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="p-4 sm:p-6 flex flex-col items-center justify-center">

    <!-- Hero Section -->
    <div class="text-center mb-8 mt-4">
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-br from-pink-500 to-purple-600 p-1 mb-4 shadow-[0_0_30px_rgba(255,0,127,0.5)]">
            <img src="https://placehold.co/200x200/1a0b2e/ff007f?text=REYA" alt="Reya Avatar" class="w-full h-full rounded-full border-2 border-black object-cover">
        </div>
        <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 neon-text tracking-tight">
            Reya AI Calling Studio
        </h1>
        <p class="text-sm text-slate-400 mt-2 font-medium">Send a hyper-realistic AI voice call to any number.</p>
    </div>

    <!-- Main VIP Card -->
    <div class="glass-card w-full max-w-xl rounded-[2rem] p-6 sm:p-8 space-y-6">
        
        <!-- Tab Navigation (Call / Recordings) -->
        <div class="flex gap-2 p-1 bg-black/40 rounded-2xl border border-white/5">
            <button onclick="switchTab('call')" id="tab-call" class="flex-1 py-3 rounded-xl bg-pink-500/20 text-pink-300 font-bold text-sm transition-all shadow-[0_0_15px_rgba(255,0,127,0.2)]">
                <i class="fa-solid fa-phone-volume mr-2"></i> Send Call
            </button>
            <button onclick="switchTab('recordings'); fetchRecordings();" id="tab-recordings" class="flex-1 py-3 rounded-xl text-slate-400 hover:text-white font-bold text-sm transition-all">
                <i class="fa-solid fa-compact-disc mr-2"></i> Recordings
            </button>
        </div>

        <!-- ================= CALL TAB ================= -->
        <div id="call-section" class="space-y-6">
            
            <!-- Target Information -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-pink-400 uppercase tracking-wider pl-1">Target Name</label>
                    <div class="bg-black/50 border border-white/10 rounded-xl p-1 glowing-input transition-all flex items-center">
                        <i class="fa-solid fa-user text-slate-500 pl-3"></i>
                        <input type="text" id="targetName" placeholder="e.g. Rahul" class="w-full bg-transparent text-white px-3 py-2.5 outline-none text-sm font-semibold">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-purple-400 uppercase tracking-wider pl-1">Mobile Number</label>
                    <div class="bg-black/50 border border-white/10 rounded-xl p-1 glowing-input transition-all flex items-center">
                        <span class="text-slate-400 pl-3 pr-2 border-r border-white/10 font-bold">+91</span>
                        <input type="tel" id="targetNumber" placeholder="9876543210" maxlength="10" class="w-full bg-transparent text-white px-3 py-2.5 outline-none text-sm font-bold tracking-widest">
                    </div>
                </div>
            </div>

            <!-- Mood Selection Grid -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-amber-400 uppercase tracking-wider pl-1">Select Vibe / Mood</label>
                <div class="grid grid-cols-2 gap-3">
                    <div onclick="selectMood(this, 'Sweet & Romantic', 'Hi baby, I was missing you so much!')" class="mood-card active p-3 rounded-xl cursor-pointer text-center bg-black/40">
                        <div class="text-xl mb-1">💖</div>
                        <div class="text-xs font-bold text-pink-200">Romantic</div>
                    </div>
                    <div onclick="selectMood(this, 'Cute Angry', 'Why didn\\'t you call me since morning? I am very angry!')" class="mood-card p-3 rounded-xl cursor-pointer text-center bg-black/40">
                        <div class="text-xl mb-1">😤</div>
                        <div class="text-xs font-bold text-purple-200">Angry GF</div>
                    </div>
                    <div onclick="selectMood(this, 'Recharge Prank', 'Hey listen, my data pack is over, can you recharge it right now?')" class="mood-card p-3 rounded-xl cursor-pointer text-center bg-black/40">
                        <div class="text-xl mb-1">😂</div>
                        <div class="text-xs font-bold text-emerald-200">Recharge Prank</div>
                    </div>
                    <div onclick="selectMood(this, 'Suspicious', 'Tell me the truth, who were you talking to late last night?')" class="mood-card p-3 rounded-xl cursor-pointer text-center bg-black/40">
                        <div class="text-xl mb-1">🕵️‍♀️</div>
                        <div class="text-xs font-bold text-rose-200">Suspicious</div>
                    </div>
                </div>
            </div>

            <!-- Custom Topic (Hidden but sends with API) -->
            <div class="space-y-1.5 hidden">
                <input type="hidden" id="selectedMood" value="Sweet & Romantic">
                <input type="hidden" id="secretLine" value="Hi baby, I was missing you so much!">
            </div>

            <!-- Dispatch Button -->
            <button onclick="dispatchCall()" id="dispatchBtn" class="call-btn w-full py-4 rounded-xl text-white font-black text-lg shadow-lg flex items-center justify-center gap-3">
                <i class="fa-solid fa-phone-volume animate-pulse"></i>
                DISPATCH AI CALL NOW
            </button>

            <!-- Status Console -->
            <div id="console-box" class="hidden bg-black/80 border border-white/10 rounded-xl p-4 text-xs font-mono">
                <div class="flex items-center gap-2 mb-2 pb-2 border-b border-white/10">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                    <span class="text-pink-400 font-bold">LIVE TERMINAL</span>
                </div>
                <div id="console-text" class="text-slate-300 space-y-1"></div>
            </div>
        </div>

        <!-- ================= RECORDINGS TAB ================= -->
        <div id="recordings-section" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-white/5">
                <span class="text-xs font-bold text-emerald-400"><i class="fa-solid fa-circle-check"></i> Auto-Synced</span>
                <button onclick="fetchRecordings()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Refresh List
                </button>
            </div>
            
            <div id="recordings-list" class="space-y-3 max-h-[400px] overflow-y-auto custom-scroll pr-2">
                <div class="text-center p-6 text-sm text-slate-500">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 text-pink-500"></i><br>
                    Loading your call history...
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-xs text-slate-500">
        Powered by Advanced Voice AI • 100% Private & Secure
    </div>

    <script>
        // HARDCODED & SECURE - Users cannot see or change this via UI settings
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHMmwfdJCcQwNxziJBIe7IRi_xG7KWHBbQMbRRC3Tcx-1cMosmttUm3zDZlFhAXCoe/exec";
        const AGENT_ID = 273702;

        function switchTab(tab) {
            document.getElementById('call-section').classList.add('hidden');
            document.getElementById('recordings-section').classList.add('hidden');
            
            document.getElementById('tab-call').className = "flex-1 py-3 rounded-xl text-slate-400 hover:text-white font-bold text-sm transition-all";
            document.getElementById('tab-recordings').className = "flex-1 py-3 rounded-xl text-slate-400 hover:text-white font-bold text-sm transition-all";

            if(tab === 'call') {
                document.getElementById('call-section').classList.remove('hidden');
                document.getElementById('tab-call').className = "flex-1 py-3 rounded-xl bg-pink-500/20 text-pink-300 font-bold text-sm transition-all shadow-[0_0_15px_rgba(255,0,127,0.2)]";
            } else {
                document.getElementById('recordings-section').classList.remove('hidden');
                document.getElementById('tab-recordings').className = "flex-1 py-3 rounded-xl bg-purple-500/20 text-purple-300 font-bold text-sm transition-all shadow-[0_0_15px_rgba(121,40,202,0.2)]";
            }
        }

        function selectMood(element, moodName, secretMsg) {
            document.querySelectorAll('.mood-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('selectedMood').value = moodName;
            document.getElementById('secretLine').value = secretMsg;
        }

        function logConsole(msg, type="info") {
            const consoleBox = document.getElementById('console-box');
            const consoleText = document.getElementById('console-text');
            consoleBox.classList.remove('hidden');
            
            let color = "text-slate-300";
            if(type === "success") color = "text-emerald-400";
            if(type === "error") color = "text-rose-400";
            if(type === "warning") color = "text-amber-400";

            consoleText.innerHTML += `<div class="${color}">> ${msg}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function dispatchCall() {
            const name = document.getElementById('targetName').value.trim() || 'Friend';
            const num = document.getElementById('targetNumber').value.trim();
            const mood = document.getElementById('selectedMood').value;
            const secret = document.getElementById('secretLine').value;
            const btn = document.getElementById('dispatchBtn');

            if(num.length !== 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            // Reset Console
            document.getElementById('console-text').innerHTML = '';
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> CONNECTING...';
            
            logConsole(`Initializing connection to Agent #${AGENT_ID}...`);
            logConsole(`Target: +91${num} (${name})`);
            logConsole(`Vibe Selected: ${mood}`);

            const payload = {
                agent_id: AGENT_ID,
                to_number: "+91" + num,
                call_context: {
                    user_name: name,
                    mood: mood,
                    secret_message: secret
                }
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if(result.id || result.call_id) {
                    logConsole(`✅ Call successfully dispatched!`, "success");
                    logConsole(`Ringing phone now... Recording will be available in 30 seconds.`, "warning");
                    
                    // Auto switch to recordings after 15 seconds
                    setTimeout(() => {
                        switchTab('recordings');
                        fetchRecordings();
                    }, 15000);
                } else {
                    logConsole(`❌ Error: ${result.message || result.error || 'Unknown server error'}`, "error");
                }
            } catch (err) {
                logConsole(`❌ Network Error: Could not reach the bridge.`, "error");
            }
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-phone-volume"></i> DISPATCH AI CALL NOW';
            }, 3000);
        }

        async function fetchRecordings() {
            const list = document.getElementById('recordings-list');
            list.innerHTML = `<div class="text-center p-6 text-sm text-pink-400 font-bold"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Fetching Secure Call Logs...</div>`;
            
            try {
                const response = await fetch(SCRIPT_URL + '?action=calls');
                let text = await response.text();
                let data = {};
                
                try { data = JSON.parse(text); } catch(e) {}

                let calls = [];
                if (Array.isArray(data)) calls = data;
                else if (data.calls && Array.isArray(data.calls)) calls = data.calls;
                else if (data.data && Array.isArray(data.data)) calls = data.data;

                if(calls.length > 0) {
                    list.innerHTML = '';
                    calls.slice(0, 10).forEach(call => {
                        const recUrl = call.recording_url || call.audio_url || call.recording || (call.artifact ? call.artifact.recordingUrl : null);
                        const status = call.status || call.call_status || 'completed';
                        
                        let mediaHtml = recUrl 
                            ? `<audio controls class="w-full h-10 rounded-lg mt-2 bg-slate-800"><source src="${recUrl}" type="audio/mpeg"></audio>`
                            : `<div class="mt-2 px-3 py-2 bg-amber-500/10 border border-amber-500/20 text-amber-300 text-[11px] rounded-lg">⏳ Call audio is processing... Check back in 15 seconds.</div>`;

                        const item = document.createElement('div');
                        item.className = "bg-black/60 border border-white/10 p-4 rounded-xl hover:border-pink-500/50 transition-all";
                        item.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-black text-pink-300 text-sm tracking-wider">${call.to_number || 'Hidden Number'}</span>
                                <span class="px-2 py-0.5 bg-slate-800 rounded text-[10px] text-slate-400 uppercase">${status}</span>
                            </div>
                            <div class="text-[10px] text-slate-500 mb-2">ID: ${call.id || call.call_id || 'Unknown'}</div>
                            ${mediaHtml}
                        `;
                        list.appendChild(item);
                    });
                } else {
                    list.innerHTML = `<div class="text-center p-6 text-sm text-slate-400">No calls found. Make a call first!</div>`;
                }
            } catch (err) {
                list.innerHTML = `<div class="text-center p-6 text-sm text-rose-400">Failed to fetch recordings. Please try again.</div>`;
            }
        }
    </script>
</body>
</html>
